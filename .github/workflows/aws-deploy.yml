name: Build and Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build application
        run: mvn -B clean package -DskipTests

      - name: Prepare deployment package
        run: |
          mkdir -p deployment
          cp "$(find target -maxdepth 1 -name '*.jar' ! -name '*.jar.original' | head -n 1)" deployment/application.jar

       - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Upload application to S3
        run: |
          aws s3 cp deployment/application.jar \
            "s3://${{ vars.EB_S3_BUCKET }}/cst323/${GITHUB_SHA}.jar"

      - name: Create Elastic Beanstalk application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "${{ vars.EB_APPLICATION }}" \
            --version-label "${GITHUB_SHA}" \
            --source-bundle S3Bucket="${{ vars.EB_S3_BUCKET }}",S3Key="cst323/${GITHUB_SHA}.jar" \
            --process

      - name: Deploy application
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name "${{ vars.EB_ENVIRONMENT }}" \
            --version-label "${GITHUB_SHA}"

      - name: Wait for deployment
        run: |
          aws elasticbeanstalk wait environment-updated \
            --environment-names "${{ vars.EB_ENVIRONMENT }}"

      - name: Verify deployment version
        run: |
          aws elasticbeanstalk describe-environments \
            --environment-names "${{ vars.EB_ENVIRONMENT }}" \
            --query 'Environments[0].[Status,Health,VersionLabel]' \
            --output table
