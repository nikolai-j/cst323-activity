<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Game</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/games}">
            Game Inventory
        </a>
    </div>
</nav>

<h1 >Add Game</h1>

<form th:action="@{/games/add}" th:object="${game}" method="post">

    <label>Title</label>
    <input type="text" th:field="*{title}" required>

    <label>Quantity</label>
    <input type="number" th:field="*{quantity}" required>

    <label>Price</label>
    <input type="number" step="0.01" th:field="*{price}" required>

    <label>Game System</label>
    <input type="text" th:field="*{gameSystem}" required>

    <button class="btn btn-success" type="submit">Add Game</button>

</form>


</body>
</html>
