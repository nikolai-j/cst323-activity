<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>All The Games!</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/games}">
            Game Inventory
        </a>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Games</h2>
        <a th:href="@{/games/add}" class="btn btn-primary">
            + Add Game
        </a>
    </div>



    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <tr th:each="game : ${games}">
                <td  th:text="${game.title}"></td>
                <td th:text="${game.quantity}"></td>
                <td th:text="${game.price}"></td>
                <td th:text="${game.gameSystem}"></td>
                <td>
                    <button class="btn btn-warning btn-sm">
                        <a th:href="@{/games/edit/{id}(id=${game.id})}">Edit</a>

                    </button>
                </td>
                <td>
                    <form th:action="@{/games/delete/{id}(id=${game.id})}"
                          method="post">
                        <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure you want to delete this game?');">
                            Delete
                        </button>
                    </form>
                </td>




                </br>
            </tr>
        </table>
    </div>
</div>


</body>
</html>
