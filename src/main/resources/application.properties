
spring.application.name=cst323-activity1

# Database configuration
spring.datasource.url=jdbc:mysql://njcst323mysqldb.mysql.database.azure.com:3306/testapp
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Server configuration
server.port=${PORT:5000}

# Application logging configuration
logging.level.root=INFO
logging.level.nj.cst323activity1=INFO

# Console logging format
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{40}.%M - %msg%n
